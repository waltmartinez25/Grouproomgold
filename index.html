
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Room Gold | Professional Facilitator Curriculum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C5A028;
            --gold-light: #E2C275;
            --bg-dark: #0A0A0A;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            overflow-x: hidden;
        }
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }
        .font-script { font-family: 'Pinyon Script', cursive; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-text { color: var(--gold); }
        .gold-border { border-color: var(--gold); }
        .gold-bg { background-color: var(--gold); }
        .gold-gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(197, 160, 40, 0.3);
        }
        .asymmetric-border {
            border-radius: 0 40px 0 40px;
        }
        ::selection {
            background: var(--gold);
            color: #000;
        }
    </style>
